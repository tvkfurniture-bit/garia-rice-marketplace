<!-- ==============================================================================
     CATALOG VIEW CONTROLLER
     ============================================================================== -->
<script>
(function(window) {
  'use strict';

  const CatalogViewController = {
    currentFilters: {
      q: '',
      variety: '',
      pack_size: '',
      grain_type: '',
      max_price: '',
      locality: 'Garia Station',
      sort: 'BEST_VALUE'
    },

    init() {
      // Register catalog routes with SPA router
      if (window.AppRouter) {
        const routeHandler = (segments, params) => this.render(params);
        window.AppRouter.register('catalog', routeHandler);
        window.AppRouter.register('search', routeHandler);
        window.AppRouter.register('products', routeHandler);
      }

      this.bindFilterEvents_();
    },

    render(params = {}) {
      const catalogViewEl = document.getElementById('view-catalog');
      if (catalogViewEl) {
        catalogViewEl.classList.remove('hidden');
      }

      // Sync active state from URL params
      this.currentFilters.q = params.q || '';
      this.currentFilters.pack_size = params.pack_size || '';
      this.currentFilters.variety = params.variety || '';
      this.currentFilters.locality = params.locality || (window.AppStore ? window.AppStore.state.selectedLocality : 'Garia Station');
      this.currentFilters.sort = params.sort || 'BEST_VALUE';

      const titleEl = document.getElementById('catalog-title');
      if (titleEl) {
        titleEl.textContent = this.currentFilters.q
          ? `Results for "${this.currentFilters.q}"`
          : 'All Rice Varieties';
      }

      const sortSelect = document.getElementById('catalog-sort-select');
      if (sortSelect) {
        sortSelect.value = this.currentFilters.sort;
      }

      this.fetchAndRenderCatalog_();
    },

    fetchAndRenderCatalog_() {
      const grid = document.getElementById('catalog-products-grid');
      const countBadge = document.getElementById('catalog-results-count');
      const curr = (window.AppStore && window.AppStore.state.serverContext.currencySymbol) || '₹';

      if (!grid || !window.AppApi) return;

      // 1. Loading Skeleton State
      grid.innerHTML = `
        <div class="card text-center" style="grid-column:1/-1;padding:40px;color:#64748b;">
          <div style="font-size:32px;animation:pulse 1s infinite;">🌾</div>
          <div style="font-weight:700;margin-top:8px;">Finding and ranking rice offerings in Garia...</div>
          <div style="font-size:12px;color:#94a3b8;">Delivering to ${escapeHtml(this.currentFilters.locality)}</div>
        </div>`;
      if (countBadge) countBadge.textContent = 'Searching...';

      // 2. Query Backend via RPC Bridge
      const queryPayload = {
        query: this.currentFilters.q,
        variety: this.currentFilters.variety,
        pack_size: this.currentFilters.pack_size,
        grain_type: this.currentFilters.grain_type,
        max_price: this.currentFilters.max_price,
        customer_locality: this.currentFilters.locality,
        sort: this.currentFilters.sort,
        limit: 40
      };

      const apiAction = this.currentFilters.q ? 'searchProducts' : 'getPublicCatalog';

      window.AppApi.call(apiAction, queryPayload)
        .then(res => {
          const products = res.products || [];
          if (countBadge) countBadge.textContent = `${products.length} Products Found`;

          if (products.length === 0) {
            grid.innerHTML = `
              <div class="card text-center" style="grid-column:1/-1;padding:40px;">
                <div style="font-size:36px;margin-bottom:10px;">🔍</div>
                <h3 style="color:var(--color-primary);margin-bottom:6px;">No Rice Products Match Your Filters</h3>
                <p style="color:#64748b;font-size:14px;max-width:480px;margin:0 auto 16px auto;">
                  Try clearing your search terms or expanding your pack size filter to find available local rice stock in Garia.
                </p>
                <button type="button" class="btn btn-secondary" onclick="window.CatalogViewController.resetFilters()">
                  Reset All Filters
                </button>
              </div>`;
            return;
          }

          // 3. Assemble Product Cards HTML
          let cardsHtml = '';
          products.forEach((p, idx) => {
            const isBestValue = idx === 0 && (this.currentFilters.sort === 'BEST_VALUE');
            const bestBadge = isBestValue ? '<span class="badge badge-best-value" style="margin-bottom:6px;">🏆 Best Delivered Value</span>' : '';

            cardsHtml += `
              <div class="product-card card-hover">
                <div class="product-card-img-wrap">
                  <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80" alt="${escapeHtml(p.name_en)}" class="product-card-img" loading="lazy">
                </div>
                <div class="product-card-body">
                  ${bestBadge}
                  <a href="#/product/${p.product_id}" style="text-decoration:none;color:inherit;">
                    <h3 class="product-card-title">${escapeHtml(p.name_en)}</h3>
                  </a>
                  <div class="product-card-seller">🏪 ${escapeHtml(p.seller_business_name)} (${escapeHtml(p.seller_locality)})</div>

                  <div style="font-size:12px;color:#64748b;margin-bottom:8px;">
                    Pack: <strong>${p.pack_size_kg} kg</strong> | Grain: ${escapeHtml(p.grain_type)}
                  </div>

                  <div class="product-card-price-row">
                    <div>
                      <div class="price-main">${curr}${p.price_inr}</div>
                      <div class="price-delivery-tag">+ ${curr}${p.delivery_fee_inr} delivery (~ ${p.approx_distance_km} km)</div>
                    </div>
                    <button type="button" class="btn btn-primary btn-sm btn-catalog-add" data-product-id="${p.product_id}">
                      + Add
                    </button>
                  </div>

                  <button type="button" class="btn btn-outline btn-card-compare" data-variety="${escapeHtml(p.variety)}" data-pack="${p.pack_size_kg}">
                    ⚖️ Compare All Sellers
                  </button>
                </div>
              </div>`;
          });

          grid.innerHTML = cardsHtml;

          // 4. Bind Add to Basket Buttons
          grid.querySelectorAll('.btn-catalog-add').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const pid = e.currentTarget.getAttribute('data-product-id');
              const found = products.find(x => x.product_id === pid);
              if (found && window.AppCart) {
                window.AppCart.addItem(found, 1);
              }
            });
          });

          // 5. Bind Compare Sellers Modal Buttons
          grid.querySelectorAll('.btn-card-compare').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const variety = e.currentTarget.getAttribute('data-variety');
              const pack = parseFloat(e.currentTarget.getAttribute('data-pack'));
              this.openComparisonModal_(variety, pack);
            });
          });

        })
        .catch(err => {
          grid.innerHTML = `
            <div class="card text-center" style="grid-column:1/-1;padding:24px;color:var(--color-danger);">
              Failed to load catalog products: ${escapeHtml(err.error || 'Connection error')}
            </div>`;
        });
    },

    openComparisonModal_(variety, packSizeKg) {
      const modalMountId = 'modal-comparison-mount';
      window.AppUI.showModal(
        `Compare Sellers: ${variety} (${packSizeKg}kg)`,
        `<div id="${modalMountId}"></div>`,
        null,
        'Close'
      );

      // Mount comparison matrix into modal dialog
      if (typeof window.renderComparisonMatrix === 'function') {
        window.renderComparisonMatrix(variety, packSizeKg, this.currentFilters.locality, modalMountId);
      }
    },

    bindFilterEvents_() {
      const sortSelect = document.getElementById('catalog-sort-select');
      const mobileFilterBtn = document.getElementById('catalog-mobile-filter-btn');
      const filterSidebar = document.getElementById('catalog-filter-sidebar');
      const filterCloseBtn = document.getElementById('filter-sidebar-close');
      const resetBtn = document.getElementById('filter-reset-btn');
      const priceBtn = document.getElementById('filter-apply-price-btn');
      const maxPriceInput = document.getElementById('filter-max-price');

      // Sort change
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          this.currentFilters.sort = e.target.value;
          this.fetchAndRenderCatalog_();
        });
      }

      // Mobile filter drawer open/close
      if (mobileFilterBtn && filterSidebar) {
        mobileFilterBtn.addEventListener('click', () => {
          filterSidebar.classList.add('drawer-open');
        });
      }

      if (filterCloseBtn && filterSidebar) {
        filterCloseBtn.addEventListener('click', () => {
          filterSidebar.classList.remove('drawer-open');
        });
      }

      // Checkbox and Radio Filter changes
      document.querySelectorAll('.filter-check, .filter-radio').forEach(input => {
        input.addEventListener('change', () => {
          if (input.name === 'pack_size') {
            this.currentFilters.pack_size = input.value;
          } else if (input.name === 'variety') {
            const checkedVarieties = Array.from(document.querySelectorAll('input[name="variety"]:checked')).map(el => el.value);
            this.currentFilters.variety = checkedVarieties.join(',');
          } else if (input.name === 'grain_type') {
            const checkedGrains = Array.from(document.querySelectorAll('input[name="grain_type"]:checked')).map(el => el.value);
            this.currentFilters.grain_type = checkedGrains.join(',');
          }
          this.fetchAndRenderCatalog_();
        });
      });

      // Price filter apply
      if (priceBtn && maxPriceInput) {
        priceBtn.addEventListener('click', () => {
          this.currentFilters.max_price = maxPriceInput.value.trim();
          this.fetchAndRenderCatalog_();
        });
      }

      // Reset filters
      if (resetBtn) {
        resetBtn.addEventListener('click', () => this.resetFilters());
      }
    },

    resetFilters() {
      this.currentFilters.q = '';
      this.currentFilters.variety = '';
      this.currentFilters.pack_size = '';
      this.currentFilters.grain_type = '';
      this.currentFilters.max_price = '';
      this.currentFilters.sort = 'BEST_VALUE';

      document.querySelectorAll('.filter-check').forEach(c => c.checked = false);
      const defaultRadio = document.querySelector('input[name="pack_size"][value=""]');
      if (defaultRadio) defaultRadio.checked = true;
      const maxPriceInput = document.getElementById('filter-max-price');
      if (maxPriceInput) maxPriceInput.value = '';

      const sidebar = document.getElementById('catalog-filter-sidebar');
      if (sidebar) sidebar.classList.remove('drawer-open');

      this.fetchAndRenderCatalog_();
    }
  };

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.CatalogViewController = CatalogViewController;
  CatalogViewController.init();

})(window);
</script>
