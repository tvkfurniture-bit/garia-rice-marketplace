<style>
/* ==============================================================================
   GARIA RICE MARKETPLACE™ - Master Design System & Responsive Styles
   Version: 1.0.0 | Hyperlocal Production MVP
   Mobile-First (320px, 375px, 390px, 414px, 768px, 1024px, 1440px)
   ============================================================================== */

:root {
  /* Brand Identity & Palette */
  --color-primary: #1b4332;         /* Deep Forest Green (Trust, Freshness) */
  --color-primary-light: #2d6a4f;   /* Emerald Green (Buttons, Active states) */
  --color-primary-dark: #081c15;    /* Very Deep Pine */
  --color-accent: #e8f5e9;          /* Pale Mint (Badges, Highlight cards) */
  --color-accent-gold: #b7791f;     /* Amber Gold (Quality stars, Best Value) */
  
  /* Feedback & Semantics */
  --color-success: #15803d;
  --color-warning: #b45309;
  --color-danger: #b91c1c;
  --color-info: #0369a1;

  /* Neutrals & Surfaces */
  --color-bg-page: #f8faf9;
  --color-bg-card: #ffffff;
  --color-border: #e2e8f0;
  --color-border-subtle: #cbd5e1;

  /* Typography Colors */
  --color-text-main: #0f172a;
  --color-text-muted: #475569;
  --color-text-light: #94a3b8;
  --color-text-on-dark: #ffffff;

  /* Elevation Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);

  /* Geometry & Rhythm */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  /* Accessible Touch Target */
  --min-touch-target: 44px;

  /* Font Stack */
  --font-family-base: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* Base Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body.app-body {
  font-family: var(--font-family-base);
  background-color: var(--color-bg-page);
  color: var(--color-text-main);
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Master Layout Containers */
.app-header-mount {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: var(--color-primary);
  box-shadow: var(--shadow-md);
}

.app-root-container {
  flex: 1 0 auto;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 16px;
}

.app-footer-mount {
  flex-shrink: 0;
  background-color: #0f172a;
  color: #f1f5f9;
  border-top: 1px solid #1e293b;
}

/* Helper Utilities */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }

/* Buttons & Accessible Touch Targets */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--min-touch-target);
  min-width: var(--min-touch-target);
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s ease-in-out;
  touch-action: manipulation;
  user-select: none;
}

.btn-primary {
  background-color: var(--color-primary-light);
  color: var(--color-text-on-dark);
}
.btn-primary:hover, .btn-primary:focus-visible {
  background-color: var(--color-primary);
}

.btn-secondary {
  background-color: #f1f5f9;
  color: var(--color-text-main);
  border-color: var(--color-border);
}
.btn-secondary:hover {
  background-color: #e2e8f0;
}

.btn-outline {
  background-color: transparent;
  color: var(--color-primary-light);
  border-color: var(--color-primary-light);
}
.btn-outline:hover {
  background-color: var(--color-accent);
}

.btn-danger {
  background-color: var(--color-danger);
  color: #ffffff;
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 13px;
}

.btn:focus-visible {
  outline: 2px solid var(--color-primary-light);
  outline-offset: 2px;
}

/* Badges & Tags */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  line-height: 1.2;
}

.badge-best-value {
  background-color: #fef3c7;
  color: #92400e;
  border: 1px solid #fde68a;
}

.badge-verified {
  background-color: #e8f5e9;
  color: #1b4332;
  border: 1px solid #c8e6c9;
}

.badge-status {
  background-color: #f1f5f9;
  color: #475569;
}

/* Cards & Surfaces */
.card {
  background-color: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

/* Form Controls */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-main);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  min-height: var(--min-touch-target);
  padding: 10px 14px;
  font-size: 15px;
  color: var(--color-text-main);
  background-color: #ffffff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--color-primary-light);
  box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
}

/* Responsive Product Grid */
.product-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-top: 20px;
}

@media (min-width: 600px) {
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 992px) {
  .product-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
}

@media (min-width: 1200px) {
  .product-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* Product Card Design */
.product-card {
  display: flex;
  flex-direction: column;
  background-color: #ffffff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.product-card-img-wrap {
  position: relative;
  width: 100%;
  height: 180px;
  background-color: #f1f5f9;
  overflow: hidden;
}

.product-card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.25s ease;
}

.product-card:hover .product-card-img {
  transform: scale(1.03);
}

.product-card-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.product-card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-main);
  margin-bottom: 4px;
  line-height: 1.3;
}

.product-card-seller {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 8px;
}

.product-card-price-row {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid #f1f5f9;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.price-main {
  font-size: 18px;
  font-weight: 800;
  color: var(--color-primary);
}

.price-delivery-tag {
  font-size: 12px;
  color: var(--color-text-muted);
}

/* Multi-Seller Comparison Matrix Component */
.comparison-container {
  overflow-x: auto;
  background-color: #ffffff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  margin: 20px 0;
}

.comparison-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 14px;
}

.comparison-table th {
  background-color: #f8faf9;
  color: #334155;
  font-weight: 700;
  padding: 12px 16px;
  border-bottom: 2px solid var(--color-border);
}

.comparison-table td {
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}

.comparison-row-best {
  background-color: #fefce8;
}

/* Responsive Mobile Cards for Comparison (Mobile < 768px) */
@media (max-width: 767px) {
  .comparison-table-desktop {
    display: none;
  }
  .comparison-cards-mobile {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .comparison-card-item {
    background-color: #ffffff;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 14px;
  }
  .comparison-card-item.best-value {
    border: 2px solid #f59e0b;
    background-color: #fffbeb;
  }
}
@media (min-width: 768px) {
  .comparison-cards-mobile {
    display: none;
  }
}

/* Order Milestone Progress Tracker */
.timeline-track {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 20px 0;
  position: relative;
}

.timeline-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  position: relative;
}

.timeline-node {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background-color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #ffffff;
  flex-shrink: 0;
  z-index: 2;
}

.timeline-step.completed .timeline-node {
  background-color: var(--color-success);
}

.timeline-step.current .timeline-node {
  background-color: var(--color-primary-light);
  box-shadow: 0 0 0 4px rgba(45, 106, 79, 0.2);
}

.timeline-details {
  flex-grow: 1;
}

.timeline-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-main);
}

.timeline-time {
  font-size: 12px;
  color: var(--color-text-muted);
}

/* Toast Container (Floating Alerts) */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 360px;
  width: calc(100% - 40px);
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background-color: #1e293b;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  animation: toastIn 0.25s ease-out;
}

.toast.toast-success { background-color: var(--color-primary-light); }
.toast.toast-error { background-color: var(--color-danger); }
.toast.toast-warning { background-color: var(--color-warning); }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Accessible Modal Overlay */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-card {
  background-color: #ffffff;
  border-radius: var(--radius-lg);
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-primary);
}

.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  line-height: 1;
  color: #64748b;
  cursor: pointer;
  min-height: 36px;
  min-width: 36px;
}

.modal-body {
  padding: 20px;
  flex-grow: 1;
}

.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--color-border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background-color: #f8fafc;
}

/* Global Loader Overlay */
.global-loader {
  position: fixed;
  inset: 0;
  background-color: #ffffff;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.loader-content {
  text-align: center;
}

.rice-spinner {
  font-size: 42px;
  animation: pulse 1.2s infinite ease-in-out;
}

.loader-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--color-primary);
  margin-top: 10px;
}

.loader-sub {
  font-size: 13px;
  color: var(--color-text-muted);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* Pack Size Chip Filters */
.pack-chips-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 8px 0;
  -webkit-overflow-scrolling: touch;
}

.chip-btn {
  white-space: nowrap;
  min-height: 36px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background-color: #ffffff;
  color: var(--color-text-main);
  cursor: pointer;
  transition: all 0.15s ease;
}

.chip-btn.active {
  background-color: var(--color-primary);
  color: #ffffff;
  border-color: var(--color-primary);
}
</style>
